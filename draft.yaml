models:
  Host:
    name: string
    url: string
    type: enum:webdav,local,s3
    status: enum:active,inactive

    # Auth
    auth_type: enum:basic,bearer,hmac nullable
    auth_credentials: json nullable

    # Network settings
    ip_address: string
    timeout: integer default:30

    # Log and monitor
    last_success_at: timestamp nullable
    last_error_at: timestamp nullable
    last_error_message: text nullable

    settings: json nullable

    timestamps: true

    relationships:
      hasMany: UploadedFile

  UploadedFile:
    user_id: unsignedInteger
    host_id: unsignedInteger

    # Basic Info
    source_path: string
    original_name: string
    size_bytes: integer
    zip_size_bytes: integer
    number_of_file: integer
    dtaset_type: enum:image,video,code,text,tabular

    hash: string

    timestamps: true

    relationships:
      belongsTo: User,Host
